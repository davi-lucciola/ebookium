services:
  postgres:
    container_name: ebookium-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ebookium
      POSTGRES_PASSWORD: ebookium
      POSTGRES_DB: ebookium
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ebookium -d ebookium" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: ebookium-backend
    build:
      context: .
      target: backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - backend-venv:/app/backend/.venv
    environment:
      APP_DATABASE_URL: postgresql+psycopg://ebookium:ebookium@postgres:5432/ebookium
      APP_TOKEN_SECRET: dev-secret-change-me
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: ebookium-frontend
    build:
      context: .
      target: frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  backend-venv:
  frontend-node-modules:
